[project]
name = "photo-bracket-sorter"
version = "1.1.1"
description = "Safe Windows desktop sorter for smartphone RAW, HEIC, JPEG, and bracketed photo sets."
requires-python = ">=3.12"
dependencies = [
  "Pillow==12.3.0",
  # 1.x only: ttkbootstrap 2.0.0 changes the Style API used by app/theme_manager.py.
  "ttkbootstrap==1.20.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests",
  "integration: integration tests",
  "exiftool: tests that require ExifTool",
  "gui: GUI smoke tests",
  "slow: slower checks",
  "windows: Windows-specific checks",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py312"
